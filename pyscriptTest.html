<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Python in HTML</title>
    <!-- Include PyScript CSS and JavaScript -->
    <link rel="stylesheet" href="https://pyscript.net" />
    <script type="module" src="https://pyscript.net"></script>
</head>
<body>

    <h1>Running Python in HTML</h1>

        print(f"The current date and time is: {datetime.now()}")
    </script>

</html>
